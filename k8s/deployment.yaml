apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-planner
  labels:
    app: meal-planner
spec:
  # Pinned to a SINGLE replica because uploaded images live on a ReadWriteOnce
  # PVC (see image-pvc.yaml, issue #181). This cluster is k3s, whose default
  # `local-path` storage class is node-local and RWO-only — a second replica on
  # another node could not mount the same volume, and would serve/write a
  # divergent, non-shared image set. One replica keeps every read and write on
  # the same durable backing store. Restoring multiple replicas requires a
  # ReadWriteMany class (NFS/Longhorn RWX) or the object-storage backend in
  # docs/ops/backup-and-restore.md.
  replicas: 1
  selector:
    matchLabels:
      app: meal-planner
  template:
    metadata:
      labels:
        app: meal-planner
    spec:
      # The prod image runs as the unprivileged `node` user (uid/gid 1000; see
      # Dockerfile `USER node`). A freshly provisioned PVC is root-owned, so
      # without this the `node` user cannot mkdir/write under the image mount and
      # uploads fail with EACCES. fsGroup makes the kubelet chown the volume to
      # gid 1000 and setgid it, giving `node` write access. OnRootMismatch skips
      # the recursive re-chown on every start once ownership is already correct.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: meal-planner
          # Immutable pin. The tag is overridden at deploy time by the Kustomize
          # `images` entry in kustomization.yaml (kept current by CI). The value
          # here is a sane default for a raw `kubectl apply -f` and must never be
          # a mutable tag such as `latest`.
          image: ghcr.io/brandonmartinez/meal-planner:v1.0.0
          # Pinned, immutable tags are content-stable, so there is no need to
          # re-pull when the tag is already cached on the node.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            # Migrations run in the dedicated meal-planner-migrate Job before
            # rollout (issue #26), never per-replica. This keeps app pods from
            # racing on `prisma migrate deploy` during a multi-replica rollout.
            - name: SKIP_MIGRATIONS
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meal-planner-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: meal-planner-secrets
                  key: jwt-secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: meal-planner-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: meal-planner-secrets
                  key: google-client-secret
            - name: CLIENT_URL
              value: "https://meals.themartinez.cloud"
            - name: GOOGLE_CALLBACK_URL
              value: "https://meals.themartinez.cloud/api/auth/google/callback"
            # Durable, writable root for uploaded image assets (issue #181).
            # Points at the mounted meal-planner-images PVC below. Not a secret
            # (see config/index.ts imageStorage note), so it uses an inline
            # value like the other non-secret config above rather than a
            # secretKeyRef. Must match the volumeMount mountPath.
            - name: IMAGE_STORAGE_ROOT
              value: "/data/images"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # Mount the durable image PVC at the path IMAGE_STORAGE_ROOT points to.
          volumeMounts:
            - name: images
              mountPath: /data/images
      # Back the image mount with the meal-planner-images PVC (image-pvc.yaml).
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: meal-planner-images
