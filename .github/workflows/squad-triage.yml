name: Squad Triage

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: github.event.label.name == 'squad'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Triage issue via Lead agent
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue;

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.warning('No .squad/team.md found — cannot triage');
              return;
            }

            const teamMd = fs.readFileSync(teamFile, 'utf8');

            const routingFile = '.squad/routing.md';
            const routingMd = fs.existsSync(routingFile)
              ? fs.readFileSync(routingFile, 'utf8')
              : '';

            // Pure decision logic lives in a testable module (see #121). It derives
            // the owner from .squad/routing.md (single source of truth) with a
            // team.md role-match fallback, and computes an idempotent side-effect
            // plan so triage never clobbers a pre-assigned owner or go:* verdict.
            const { decide } = require(path.resolve('.github/workflows/scripts/triage-decision.cjs'));

            const existingLabels = (issue.labels || [])
              .map(l => (typeof l === 'string' ? l : l && l.name))
              .filter(Boolean);

            const plan = decide({
              issueTitle: issue.title,
              issueBody: issue.body || '',
              labels: existingLabels,
              teamMd,
              routingMd,
            });

            if (!plan.ok) {
              if (plan.error === 'no-lead') {
                core.warning('No Lead role found in team roster — cannot triage');
              } else {
                core.warning(`Triage aborted: ${plan.error}`);
              }
              return;
            }

            const {
              members, lead, hasCopilot, copilotAutoAssign,
              assignedMember, assignLabel, triageReason, copilotTier, isCopilot,
              ownerPreAssigned, existingOwnerLabel, existingGoLabel,
              applyOwnerLabel, applyGoNeedsResearch, applyCopilotAssignee,
            } = plan;

            function slugify(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

            const memberList = members.map(m =>
              `- **${m.name}** (${m.role}) → label: \`squad:${slugify(m.name)}\``
            ).join('\n');

            // Add the owner label only when no owner was pre-assigned (idempotent).
            if (applyOwnerLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [assignLabel]
              });
            }

            // Apply the default triage verdict only when no go:* verdict exists yet.
            if (applyGoNeedsResearch) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['go:needs-research']
              });
            }

            // Auto-assign @copilot if enabled and we routed to it this run.
            if (applyCopilotAssignee && copilotAutoAssign) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: ['copilot']
                });
              } catch (err) {
                core.warning(`Could not auto-assign @copilot: ${err.message}`);
              }
            }

            // Build copilot evaluation note
            let copilotNote = '';
            if (hasCopilot && !isCopilot) {
              if (copilotTier === 'not-suitable') {
                copilotNote = `\n\n**@copilot evaluation:** 🔴 Not suitable — issue involves work outside the coding agent's capability profile.`;
              } else if (!ownerPreAssigned) {
                copilotNote = `\n\n**@copilot evaluation:** No strong capability match — routed to squad member.`;
              }
            }

            // Idempotency notes for the triage comment.
            const ownerNote = ownerPreAssigned
              ? `\n\n**Owner:** Pre-assigned owner \`${existingOwnerLabel}\` respected — no owner change made.`
              : '';
            const goNote = !applyGoNeedsResearch
              ? `\n\n**Verdict:** Existing \`${existingGoLabel}\` left as-is — \`go:needs-research\` not added.`
              : '';

            // Post triage comment
            const comment = [
              `### 🏗️ Squad Triage — ${lead.name} (${lead.role})`,
              '',
              `**Issue:** #${issue.number} — ${issue.title}`,
              `**Assigned to:** ${assignedMember.name} (${assignedMember.role})`,
              `**Reason:** ${triageReason}`,
              copilotTier === 'needs-review' ? `\n⚠️ **PR review recommended** — a squad member should review @copilot's work on this one.` : '',
              copilotNote,
              ownerNote,
              goNote,
              '',
              `---`,
              '',
              `**Team roster:**`,
              memberList,
              hasCopilot ? `- **@copilot** (Coding Agent) → label: \`squad:copilot\`` : '',
              '',
              `> To reassign, remove the current \`squad:*\` label and add the correct one.`,
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            core.info(`Triaged issue #${issue.number} → ${assignedMember.name} (${assignLabel}) [owner:${applyOwnerLabel ? 'added' : 'pre-assigned'}, go:${applyGoNeedsResearch ? 'needs-research' : 'existing'}]`);
